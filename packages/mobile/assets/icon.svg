<?xml version="1.0" encoding="UTF-8"?>
<!-- musex iOS app icon: full-bleed variant of assets/icon.svg. iOS masks the
     corners itself, so the brand gradient fills the entire 1024px canvas (no
     squircle inset, no transparent corners) and the lucide Disc3 glyph is
     centered. Rendered to packages/mobile/assets/icon.png (referenced by
     app.json) — keep them in sync. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e27"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54d2a0"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- lucide Disc3, 24-unit viewBox scaled to ~494px, centered -->
  <g transform="translate(264.8 264.8) scale(20.6)"
     fill="none" stroke="url(#glyph)" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M6 12c0-1.7.7-3.2 1.8-4.2"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M18 12c0 1.7-.7 3.2-1.8 4.2"/>
  </g>
</svg>
