# electron-builder 26 configuration (verified against installed app-builder-lib 26.15.2).
#
# Signing: identity comes from env in CI — CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD.
# Local unsigned builds: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @musex/desktop run package
#
# Notarization: `notarize: true` + env APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
# @electron/notarize notarizes AND staples the .app before the dmg is built.
#
# Nested binaries: @electron/osx-sign walks the whole Contents/ tree (including
# Resources/) and signs every Mach-O it finds plus nested .app/.framework bundles
# inside-out — so the vendored mpv.app and all its dylibs are signed automatically;
# no `binaries` list needed.
appId: net.stupendous.musex
productName: musex
# executableName defaults to the package.json `name` (@musex/desktop), which
# sanitizes to `@musexdesktop` — the leading `@` is rejected by the Linux
# AppImage builder ("characters that cannot be safely used in file paths").
# macOS uses productName for the executable so it's unaffected; pin it here so
# the Linux binary/AppImage is a clean `musex`.
executableName: musex
# Auto-update safety: ShipIt can't strip quarantine xattrs from read-only
# files (mpv ships some), which aborts the whole install. See the hook.
afterPack: build/ensure-writable.cjs
directories:
  output: release
  buildResources: build
files:
  - "out/**/*"
mac:
  # Pre-built .icns (generated from assets/icon.svg by scripts/gen-icon.sh,
  # committed). electron-builder ships a provided .icns AS-IS — its own
  # PNG->ICNS conversion produced corrupt 16/32px representations (rainbow
  # noise in Finder list view / Get Info), so never hand it the PNG.
  icon: build/icon.icns
  # zip is REQUIRED alongside dmg: electron-updater on macOS (Squirrel.Mac)
  # updates from the zip; latest-mac.yml points at it.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  # Standard Electron hardened-runtime entitlements (same set as electron-builder's
  # built-in template, pinned explicitly). disable-library-validation also lets the
  # vendored mpv load its bundled dylibs. Applied to the app and inherited by
  # nested binaries.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # `from` resolves relative to the project directory (packages/desktop) — vendor/
    # lives at the repo root.
    # mpv lands at Resources/mpv/mpv.app/Contents/MacOS/mpv (matches mpv-paths.ts).
    - from: ../../vendor/mpv/darwin-arm64/
      to: mpv/
# Auto-update feed (electron-updater). Having a `publish` config makes
# electron-builder embed app-update.yml into the .app (Resources/) and emit
# latest-mac.yml into release/ even with --publish never (CI uploads artifacts
# itself via `gh release upload`). GitHub provider expects v-prefixed release
# tags (vX.Y.Z) — release-please is configured with include-component-in-tag:
# false accordingly.
publish:
  provider: github
  owner: matjam
  repo: musex
linux:
  # Window association: Electron derives the Wayland app_id / WM_CLASS from
  # `desktopName` in package.json ("musex.desktop"); syncDesktopName makes the
  # installed .desktop filename + its StartupWMClass match, so desktop
  # environments (notably GNOME/Wayland) link the running window to the
  # launcher — correct icon + grouping in the dock/taskbar. Keyed on "musex"
  # to match executableName, so the AppImage's baked musex.desktop name (which
  # the Arch PKGBUILD references) is unchanged.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: AudioVideo
  maintainer: Nathan Ollerenshaw <nathan@ollerenshaw.org>
  synopsis: Spotify-style desktop player for your Plex music library
  description: >-
    musex streams your own Plex music library with gapless, all-codec direct
    play (via mpv), smart mixes, Last.fm discovery, and installable plugins.
  desktop:
    entry:
      Categories: AudioVideo;Audio;Player;
appImage:
  # Deterministic name so packaging/arch/PKGBUILD can pin the download URL.
  # electron-updater (latest-linux.yml) tracks whatever name this produces.
  artifactName: ${productName}-${version}-x86_64.AppImage
deb:
  # Default deb artifactName is ${name}_${version}_${arch} → @musex/desktop_…,
  # whose `@` and `/` are invalid in a filename (the `/` even nests it in a
  # subdir, so the release upload glob `release/*.deb` would miss it). Pin a
  # clean name.
  artifactName: ${productName}_${version}_amd64.deb
  priority: optional
  depends:
    # electron-builder 26's default deb depends (verified from
    # node_modules/app-builder-lib/out/targets/FpmTarget.js getDefaultDepends("deb"))
    # plus mpv (musex shells out to the system mpv on Linux).
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - mpv
