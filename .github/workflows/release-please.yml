name: Release Please

on:
  push:
    branches:
      - main
  # Manual rebuild of an existing release's DMG (e.g. after a CI-only fix):
  # runs the build job against main HEAD and uploads to the given tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload the DMG for"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Manifest mode (no release-type input): reads release-please-config.json
      # + .release-please-manifest.json at the repo root.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Immediately convert the new release to a draft so it isn't visible to
      # users until all platform builds succeed and finalize publishes it.
      # gh is pre-installed on ubuntu-latest; GITHUB_TOKEN has contents:write.
      - name: Mark release as draft while builds run
        if: steps.release.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --repo matjam/musex --draft

  build-macos:
    needs: release-please
    # Runs when release-please just cut a release, or on manual dispatch for an
    # existing tag (needs.release-please is skipped then — always() lets the
    # job evaluate its own condition instead of being skipped with it).
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    # macos-latest is arm64 — matches the darwin-arm64 mpv vendor pin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor mpv
        run: pnpm vendor

      - name: Check (typecheck + lint + tests)
        run: pnpm check

      - name: Package (sign + notarize + staple)
        env:
          # electron-builder signing: CSC_LINK accepts a base64-encoded .p12.
          CSC_LINK: ${{ secrets.DEVELOPER_ID_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          # electron-builder notarization (@electron/notarize: notarizes and
          # staples the .app before the dmg is built).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @musex/desktop run package

      # zip + latest-mac.yml are the electron-updater feed: the updater reads
      # latest-mac.yml from the release assets and downloads the zip.
      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG_NAME" \
            packages/desktop/release/*.dmg \
            packages/desktop/release/*.zip \
            packages/desktop/release/*.blockmap \
            packages/desktop/release/latest-mac.yml \
            --clobber

  build-linux:
    needs: release-please
    # Same gating as build-macos: fires on a new release or manual dispatch.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No vendor step — Linux uses system mpv; the desktop package step does
      # not require the vendor binary to be present for AppImage/deb builds.
      # No signing env — Linux builds are unsigned.
      # If the deb build fails on a missing tool, add:
      #   sudo apt-get update && sudo apt-get install -y fakeroot
      # before the package step (ubuntu-latest usually has what electron-builder
      # needs for AppImage+deb, so try without it first).
      - name: Check (typecheck + lint + tests)
        run: pnpm check

      - name: Package (AppImage + deb)
        run: pnpm --filter @musex/desktop run package

      # latest-linux.yml is the electron-updater feed for Linux.
      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          # No *.blockmap glob: the Linux AppImage uses an EMBEDDED block map
          # (blockMapSize recorded in latest-linux.yml), so electron-builder
          # emits no separate .blockmap file — an unmatched glob would pass
          # through literally and fail `gh release upload`.
          gh release upload "$TAG_NAME" \
            packages/desktop/release/*.AppImage \
            packages/desktop/release/*.deb \
            packages/desktop/release/latest-linux.yml \
            --clobber

      # Per-release Arch PKGBUILD: the repo file (packaging/arch/PKGBUILD) is the
      # template; here we pin it to THIS release's version + the real AppImage
      # sha256 and upload it as a release asset named `PKGBUILD`. Arch users:
      #   curl -LO https://github.com/matjam/musex/releases/latest/download/PKGBUILD
      #   makepkg -si
      # (latest/download/PKGBUILD always resolves to the newest release's copy.)
      - name: Publish Arch PKGBUILD asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          VER=$(node -p "require('./packages/desktop/package.json').version")
          APPIMAGE="packages/desktop/release/musex-${VER}-x86_64.AppImage"
          SHA=$(sha256sum "$APPIMAGE" | cut -d' ' -f1)
          mkdir -p /tmp/aur
          sed -e "s/^pkgver=.*/pkgver=${VER}/" \
              -e "s|^sha256sums=.*|sha256sums=('${SHA}')|" \
              packaging/arch/PKGBUILD > /tmp/aur/PKGBUILD
          gh release upload "$TAG_NAME" /tmp/aur/PKGBUILD --clobber

  build-windows:
    needs: release-please
    # Same gating as build-macos/build-linux: fires on a new release or dispatch.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows BUNDLES mpv (like macOS): fetch + 7z-extract the zhongfly
      # winbuild. 7-Zip is pre-installed on windows-latest.
      - name: Vendor mpv
        run: pnpm vendor

      - name: Check (typecheck + lint + tests)
        run: pnpm check

      # electron-builder builds the win targets (nsis installer + portable),
      # unsigned — no Windows cert env.
      - name: Package (unsigned)
        run: pnpm --filter @musex/desktop run package

      # latest.yml is the electron-updater feed for Windows; the .exe glob
      # covers both the NSIS installer and the portable build.
      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        shell: pwsh
        run: |
          gh release upload "$env:TAG_NAME" `
            (Get-Item packages/desktop/release/*.exe) `
            (Get-Item packages/desktop/release/*.blockmap) `
            packages/desktop/release/latest.yml `
            --clobber

  build-ios:
    needs: release-please
    # Same gating as the desktop jobs: a new release-please release, or a manual
    # dispatch to (re)build TestFlight from main HEAD.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    # iOS builds REQUIRE macOS (Xcode is macOS-only). macos-latest is free +
    # unlimited on this PUBLIC repo (no 10x Actions-minute multiplier), and
    # `eas build --local` runs the build ON the runner — it does NOT consume EAS
    # cloud build credits.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Full workspace install: `eas build --local` runs Metro, which resolves
      # @musex/core from source through the hoisted pnpm layout.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Build number (CFBundleVersion) = the monotonically-increasing GitHub run
      # number. The marketing version (CFBundleShortVersionString) comes from
      # app.json's expo.version, which release-please keeps in sync with the
      # release version — so TestFlight shows e.g. 0.16.5 and the build number
      # just has to be unique + increasing for Apple to accept each upload.
      # (appVersionSource is "local" with no autoIncrement: remote versioning /
      # autoIncrement don't reliably bump for `eas build --local`, so the build
      # number is set deterministically here instead.)
      - name: Set iOS build number to the run number
        working-directory: packages/mobile
        run: |
          tmp=$(mktemp)
          jq --arg bn "$GITHUB_RUN_NUMBER" '.expo.ios.buildNumber = $bn' app.json > "$tmp"
          mv "$tmp" app.json

      # `eas build --local` runs prebuild + pod install + xcodebuild on the
      # runner. Signing credentials (Distribution cert + provisioning profile)
      # are pulled from EAS via EXPO_TOKEN — created once during bootstrap.
      #
      # EXPO_USE_SOURCE=1: compile Expo modules FROM SOURCE instead of as
      # precompiled xcframeworks. The default (SDK 54+) prebuilt path adds a
      # "[CP-User] Build ExpoModulesJSI xcframework" archive script phase whose
      # nested xcodebuild does its own SPM resolution and fails on the CI runner
      # with "Could not resolve package dependencies", aborting the archive.
      # Building from source removes that phase. Must be set at pod-install time,
      # which `eas build --local` runs internally, so it's a job env var.
      #
      # SECURITY — output is redacted: `eas build --local` echoes the build job
      # as a base64 argv to eas-cli-local-build-plugin, and that payload embeds
      # the iOS signing credentials (distribution cert .p12 + password). On this
      # PUBLIC repo that would leak into the Actions log. The sed filter replaces
      # any 200+ char base64-ish token with ***REDACTED*** before it's logged.
      # The default shell runs with `pipefail`, so eas's non-zero exit still
      # fails the step. Short error lines (e.g. xcodebuild errors) are untouched.
      - name: Build iOS app (.ipa)
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_USE_SOURCE: "1"
        run: |
          eas build --local --platform ios --profile production --non-interactive --output "$RUNNER_TEMP/musex.ipa" 2>&1 \
            | sed -E 's|[A-Za-z0-9+/=_-]{200,}|***REDACTED***|g'
          # Propagate eas's real exit code — the sed pipe would otherwise mask a
          # build failure as success.
          test "${PIPESTATUS[0]}" -eq 0
          # Belt-and-suspenders: a green eas exit with no IPA is still a failure.
          test -f "$RUNNER_TEMP/musex.ipa"

      # Upload to App Store Connect -> TestFlight. The App Store Connect API key
      # is stored on EAS servers (generated during bootstrap), so EXPO_TOKEN is
      # the ONLY secret needed; the target app (ascAppId) is set in eas.json.
      # iOS isn't a downloadable artifact, so there is no `gh release upload`.
      # Same base64-payload redaction as the build step (eas submit serializes
      # the ASC API key the same way). Only runs on a real release — a manual
      # workflow_dispatch builds but does not submit.
      - name: Submit to TestFlight
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/musex.ipa" --non-interactive 2>&1 \
            | sed -E 's|[A-Za-z0-9+/=_-]{200,}|***REDACTED***|g'

  # Runs after all platform builds complete (always, so it fires even on failure).
  # - All builds succeeded → publish the draft release so it becomes visible.
  # - Any build failed     → delete the draft + tag; next fix commit recreates it.
  # Skipped on workflow_dispatch (release_created is falsy — rebuilding an
  # existing published release, not cutting a new one).
  finalize:
    needs: [release-please, build-macos, build-linux, build-windows, build-ios]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        if: >-
          ${{ needs.build-macos.result   == 'success' &&
              needs.build-linux.result   == 'success' &&
              needs.build-windows.result == 'success' &&
              needs.build-ios.result     == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo matjam/musex --draft=false

      - name: Delete draft (one or more builds failed)
        if: >-
          ${{ needs.build-macos.result   == 'failure' ||
              needs.build-linux.result   == 'failure' ||
              needs.build-windows.result == 'failure' ||
              needs.build-ios.result     == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release delete "$TAG_NAME" --repo matjam/musex --yes --cleanup-tag
