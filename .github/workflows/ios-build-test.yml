name: iOS Build Test

# Manually-triggered iOS build for verifying the build works WITHOUT cutting a
# release or submitting to TestFlight. Run it from the Actions tab → "iOS Build
# Test" → "Run workflow". It builds the .ipa with `eas build --local` and stops
# — no `eas submit`. Use this to confirm an iOS build before relying on it in
# the real release pipeline (release-please.yml's build-ios job).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Set iOS build number to the run number
        working-directory: packages/mobile
        run: |
          tmp=$(mktemp)
          jq --arg bn "$GITHUB_RUN_NUMBER" '.expo.ios.buildNumber = $bn' app.json > "$tmp"
          mv "$tmp" app.json

      # ExpoModulesJSI's apple/Package.swift declares `swift-tools-version: 6.2`,
      # which needs Swift 6.2 = Xcode 26+. The runner's DEFAULT Xcode is 16.4
      # (Swift 6.1), so SwiftPM can't parse the manifest and the ExpoModulesJSI
      # xcframework build fails ("Could not resolve package dependencies"). Force
      # the newest installed Xcode; build-xcframework.sh forwards DEVELOPER_DIR
      # into its nested `env -i` xcodebuild, so the whole build uses it.
      - name: Select newest Xcode (need >= 26 for swift-tools 6.2)
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected Xcode: $newest"

      # Build only — NOT submitted. The sed filter redacts the base64 job payload
      # (which embeds signing credentials) so it can't leak into this PUBLIC
      # repo's logs. `exit ${PIPESTATUS[0]}` propagates eas's real exit code (the
      # sed pipe would otherwise mask a failure as success).
      - name: Build iOS app (.ipa) — build only, not submitted
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local --platform ios --profile production --non-interactive --output "$RUNNER_TEMP/musex.ipa" 2>&1 \
            | sed -E 's|[A-Za-z0-9+/=_-]{200,}|***REDACTED***|g'
          exit ${PIPESTATUS[0]}

      - name: Confirm IPA was produced
        run: |
          ls -la "$RUNNER_TEMP/musex.ipa"
          echo "iOS build succeeded (not submitted)."
