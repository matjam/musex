name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write # the build-artifacts comment

jobs:
  build:
    # Build the app on all three platforms on every PR (and push to main):
    # runs the full electron-builder package UNSIGNED and WITHOUT publishing,
    # so packaging breakage (the win block, mpv bundling, icons, nsis/dmg) and
    # platform-specific test/lint/typecheck failures are caught pre-merge — not
    # at release time. Signing/notarization/upload stay in release-please.yml.
    #
    # Skip release-please PRs: they're a version-bump/changelog-only diff over
    # main (already built green on merge), and merging one fires the real signed
    # release build — so a full 3-platform build there is pure redundancy (and a
    # bot-authored PR that would otherwise sit awaiting Actions approval). Push
    # to main has an empty head_ref, so it still builds.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifacts: |
              packages/desktop/release/*.AppImage
              packages/desktop/release/*.deb
          - os: macos-latest
            name: macos
            artifacts: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*.zip
          - os: windows-latest
            name: windows
            artifacts: |
              packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # darwin: vendored mpv zip; windows: vendored mpv .7z (7-Zip is on the
      # runner); linux: no-op (mpv is a system dep, not bundled).
      - name: Vendor mpv
        run: pnpm vendor

      - name: Check (typecheck + lint + tests)
        run: pnpm check

      # Unsigned, no-publish package. CSC_IDENTITY_AUTO_DISCOVERY=false skips
      # code-signing on macOS; package:ci adds -c.mac.notarize=false. No Apple/
      # Windows certs needed, so this works on PRs (incl. the no-secrets case).
      - name: Build (unsigned, no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @musex/desktop run package:ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musex-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  comment:
    # On a PR where all three builds succeeded, post (or update) a single
    # comment linking the artifacts. Same-repo only — fork PRs get a read-only
    # token and can't comment.
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      needs.build.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-build-artifacts -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### 📦 Build artifacts',
              '',
              'All three platform builds passed. Download the **unsigned** installers from this run (artifacts expire after 14 days):',
              '',
              `**[⬇ Artifacts for this run](${runUrl})**`,
              '',
              '- 🍎 macOS — `musex-macos` (dmg + zip)',
              '- 🐧 Linux — `musex-linux` (AppImage + deb)',
              '- 🪟 Windows — `musex-windows` (installer + portable exe)',
              '',
              `_Unsigned CI builds for testing only — not for distribution. Commit \`${sha}\`._`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
