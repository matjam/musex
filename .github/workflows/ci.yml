name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the build-artifacts comment

jobs:
  build:
    # Build the app on all three platforms on every PR:
    # runs the full electron-builder package UNSIGNED and WITHOUT publishing,
    # so packaging breakage (the win block, mpv bundling, icons, nsis/dmg) and
    # platform-specific test/lint/typecheck failures are caught pre-merge — not
    # at release time. Signing/notarization/upload stay in release-please.yml.
    #
    # Skip release-please PRs: they're a version-bump/changelog-only diff over
    # main (already built green on merge), and merging one fires the real signed
    # release build — so a full 3-platform build there is pure redundancy (and a
    # bot-authored PR that would otherwise sit awaiting Actions approval). Gate
    # on the BOT IDENTITY + same-repo, not just the branch name (which anyone
    # could spoof to skip CI on their own PR).
    if: >-
      ${{ !(
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')
      ) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifacts: |
              packages/desktop/release/*.AppImage
              packages/desktop/release/*.deb
          - os: macos-latest
            name: macos
            artifacts: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*.zip
          - os: windows-latest
            name: windows
            artifacts: |
              packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    # Redirect the two big download caches into the workspace so one cache step
    # (below) can capture them on every OS: @electron/get's Electron binary zip
    # (ELECTRON_CACHE, used by electron's install postinstall) and
    # electron-builder's tool downloads (ELECTRON_BUILDER_CACHE — NSIS +
    # winCodeSign on Windows, ~100MB+).
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Cache the heavy, deterministic downloads that don't change between runs:
      # the vendored mpv binary (`pnpm vendor` is idempotent — a hit no-ops) and
      # the Electron + electron-builder tool downloads. Keyed on the lockfile +
      # the mpv pin script, so a dep bump or mpv-version change busts it; the
      # restore-keys fall back to the newest same-OS cache otherwise. pnpm's own
      # store is already cached by setup-node above.
      - name: Cache mpv + Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            vendor/mpv
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/fetch-mpv.mjs') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # darwin: vendored mpv zip; windows: vendored mpv .7z (7-Zip is on the
      # runner); linux: no-op (mpv is a system dep, not bundled).
      - name: Vendor mpv
        run: pnpm vendor

      - name: Check (typecheck + lint + tests)
        run: pnpm check

      # Unsigned, no-publish package. CSC_IDENTITY_AUTO_DISCOVERY=false skips
      # code-signing on macOS; package:ci adds -c.mac.notarize=false. No Apple/
      # Windows certs needed, so this works on PRs (incl. the no-secrets case).
      - name: Build (unsigned, no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @musex/desktop run package:ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musex-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  build-ios:
    # Build the iOS app on every PR so iOS/native breakage (expo prebuild, pod
    # install, the ExpoModulesJSI xcframework / Swift-toolchain version, native
    # module compile) is caught pre-merge — the same class of failure that
    # blocked a release before. This is a SIMULATOR build: no code-signing, so
    # it needs NO distribution cert / provisioning profile and is NOT submitted
    # to TestFlight. The real signed TestFlight build stays in
    # release-please.yml; this just proves the app compiles.
    #
    # Skip release-please PRs, same as the desktop build job above.
    if: >-
      ${{ !(
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')
      ) }}
    # iOS builds REQUIRE macOS (Xcode is macOS-only). macos-latest is free +
    # unlimited on this PUBLIC repo, and `eas build --local` runs ON the runner
    # (no EAS cloud build credits consumed).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version read from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Full workspace install: `eas build --local` runs Metro, which resolves
      # @musex/core from source through the hoisted pnpm layout.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # ExpoModulesJSI's apple/Package.swift declares `swift-tools-version: 6.2`,
      # which needs Swift 6.2 = Xcode 26+. The runner's DEFAULT Xcode is 16.4
      # (Swift 6.1), so SwiftPM can't parse the manifest and the ExpoModulesJSI
      # xcframework build fails ("Could not resolve package dependencies"). Force
      # the newest installed Xcode; build-xcframework.sh forwards DEVELOPER_DIR
      # into its nested `env -i` xcodebuild, so the whole build uses it.
      - name: Select newest Xcode (need >= 26 for swift-tools 6.2)
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected Xcode: $newest"

      # Simulator build: prebuild + pod install + xcodebuild for the iOS
      # simulator. NO signing credentials are fetched (simulator builds aren't
      # signed), so there's nothing sensitive in the eas-cli-local-build-plugin
      # payload to leak — but the same 200+ char base64 redaction is kept as
      # defense-in-depth, and the real exit code is propagated past the sed pipe.
      # EXPO_TOKEN authenticates eas-cli to resolve the project (no creds pulled).
      - name: Build iOS app (simulator, unsigned, not submitted)
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local --platform ios --profile ci-simulator --non-interactive --output "$RUNNER_TEMP/musex-sim.tar.gz" 2>&1 \
            | sed -E 's|[A-Za-z0-9+/=_-]{200,}|***REDACTED***|g'
          test "${PIPESTATUS[0]}" -eq 0
          test -f "$RUNNER_TEMP/musex-sim.tar.gz"

  comment:
    # On a PR where all three builds succeeded, post (or update) a single
    # comment linking the artifacts. Same-repo only — fork PRs get a read-only
    # token and can't comment.
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      needs.build.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-build-artifacts -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### 📦 Build artifacts',
              '',
              'All three platform builds passed. Download the **unsigned** installers from this run (artifacts expire after 14 days):',
              '',
              `**[⬇ Artifacts for this run](${runUrl})**`,
              '',
              '- 🍎 macOS — `musex-macos` (dmg + zip)',
              '- 🐧 Linux — `musex-linux` (AppImage + deb)',
              '- 🪟 Windows — `musex-windows` (installer + portable exe)',
              '',
              `_Unsigned CI builds for testing only — not for distribution. Commit \`${sha}\`._`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
