<?xml version="1.0" encoding="UTF-8"?>
<!-- musex app icon: lucide Disc3 (the sidebar's Albums glyph) in the brand
     gradient on the app's dark squircle. Big Sur grid: 824px squircle
     centered on a 1024px canvas, corner radius 22.5%. Rasterized to
     packages/desktop/build/icon.png by scripts/gen-icon.sh. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e27"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54d2a0"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none"
        stroke="rgba(255,255,255,0.07)" stroke-width="6"/>

  <!-- lucide Disc3, 24-unit viewBox scaled to ~494px, centered -->
  <g transform="translate(264.8 264.8) scale(20.6)"
     fill="none" stroke="url(#glyph)" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M6 12c0-1.7.7-3.2 1.8-4.2"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M18 12c0 1.7-.7 3.2-1.8 4.2"/>
  </g>
</svg>
