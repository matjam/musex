packages:
  - "packages/*"

# pnpm 11 gates dependency build scripts; allowlist the ones that need them.
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - app-builder-lib@26.15.2
  - dmg-builder@26.15.2
  - electron-builder-squirrel-windows@26.15.2
  - electron-builder@26.15.2

patchedDependencies:
  '@regosen/gapless-5@1.6.2': patches/@regosen__gapless-5@1.6.2.patch
