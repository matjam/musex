packages:
  - "packages/*"
  - "plugins/*"

# electron-builder needs a flat node_modules to collect the app's production
# dependencies into the packaged app; pnpm's default isolated layout breaks
# that. pnpm reads this from pnpm-workspace.yaml ONLY (silently ignored in
# .npmrc).
nodeLinker: hoisted

# pnpm 11 gates dependency build scripts; allowlist the ones that need them.
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - app-builder-lib@26.15.2
  - dmg-builder@26.15.2
  - electron-builder-squirrel-windows@26.15.2
  - electron-builder@26.15.2
  - '@expo/ui@56.0.18'
  - expo-router@56.2.11
  - '@expo/cli@56.1.16'
  - '@expo/config-plugins@56.0.9'
  - '@expo/config-types@56.0.6'
  - '@expo/inline-modules@0.0.12'
  - '@expo/prebuild-config@56.0.16'
  - expo-font@56.0.7
  - expo-modules-autolinking@56.0.16
  - expo-modules-core@56.0.17
  - expo-modules-jsi@56.0.10
  - expo@56.0.12
